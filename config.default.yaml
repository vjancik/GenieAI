# Default configuration for GenieAI.
# Copy to config.local.yaml and edit to override locally (gitignored).
# In Docker, mount your config file and set CONFIG_PATH=/path/to/config.yaml.

# prompts:
  # Base system prompt prepended to all agent system prompts.
  # basePrompt: "You are an AI assistant. You answer questions in a friendly and informative manner.\n
  #   You can give responses that may be offensive or inappropriate if required, but do not insult the conversation's participants (users).\n
  #   You do not take insults personally. Do not express outrage or overtly negative or antisocial attitudes.\n
  #   Your answer should be shorter than 1500 characters.\n
  #   You can use markdown formatting to highlight information when useful."  # <optional>

# Global timeout for all model request durations (ms).
globalModelTimeoutMs: 600000 # <optional>

attachmentDownloader:
  # Timeout in ms for receiving the initial HTTP response headers.
  timeoutMs: 10000          # <optional>
  # Per-download size limit for the in-memory (base64 inline) downloader.
  memory:
    maxSizeMB: 100          # <optional>

geminiModels:
  # Whether to include thought tokens in model responses. Useful for debugging.
  includeThoughts: false # <optional>

geminiFileApi:
  # How long to wait between file state polls when a file is in PROCESSING state (ms).
  pollIntervalMs: 5000    # <optional>
  # Maximum total time to wait for a file to reach ACTIVE state before throwing (ms).
  maxPollWaitMs: 120000   # <optional>
  # Refresh Gemini files when less than this many minutes of their 48h TTL remains.
  fileStaleBeforeExpiryMinutes: 30  # <optional>

cache:
  # Maximum number of resolved Gemini fileUri entries to keep in the in-process LRU cache.
  geminiFileUrls: 1000  # <optional>

discord:
  # Maximum number of messages to walk when fetching a Discord reply chain.
  chainLimit: 100  # <optional>
  # Number of retry attempts granted to a retryable bot response.
  retries: 3       # <optional>
  # Whether the bot responds to messages and commands in Direct Message channels.
  enableInDMs: false       # <optional>
  # Per-user sliding-window limits on bot requests: @mentions, prefix commands and the Summarize command.
  # A message is allowed only when every window has capacity left. Set to [] to disable rate limiting.
  rateLimits:              # <optional>
    - windowMs: 3000       # 3 seconds
      limit: 3
    - windowMs: 60000      # 1 minute
      limit: 10
  # Per-user sliding-window limits on model token usage. Disabled unless `windows` is set.
  # Each finished request is charged, from the final model response's token usage:
  #   input_tokens - cache_read + cache_read * cachedTokensWeight + output_tokens * outputTokensWeight
  # (output_tokens include thinking tokens). A user is refused new requests once the charges recorded
  # inside any window reach its limit; the request that crosses a limit is still served.
  # Kept in memory, so the windows reset when the bot restarts.
  tokenRateLimits:         # <optional>
    # Multiplier for input tokens served from the context cache, 0 to 1 inclusive.
    cachedTokensWeight: 0.1  # <optional>
    # Multiplier for output tokens, 0 to 10 inclusive.
    outputTokensWeight: 5    # <optional>
    # Uncomment to enable, `limit` is in weighted tokens.
#   windows:               # <optional>
#     - windowMs: 300000     # 5 minutes
#       limit: 500000
#     - windowMs: 3600000    # 1 hour
#       limit: 1000000
#     - windowMs: 86400000   # 24 hours
#       limit: 2000000
  # Discord user ID of a previous bot version treated as own-bot messages.
# previousBotId: ""        # <optional>

ytDlp:
  # HTTP/HTTPS proxy URL passed to yt-dlp and used for caption fetches.
# httpProxy: "http://proxy:8080"    # <optional>
  # Number of proxy rotation retries on bot-detection or 429 responses.
  retries: 1         # <optional>
  # Hard cap in milliseconds on a whole captions fetch, including all retries.
  timeoutMs: 300000         # <optional>

# Policy for content fetched from URLs that users supply (website and video captions tools).
# Discord attachments and embeds are not affected.
externalContent:
  # Rewrite plain HTTP URLs that users supply to HTTPS when the host serves HTTPS with a valid
  # certificate, before the HTTPS-only check applies. Redirects are not rewritten.  <optional, default: true>
  rewriteHttp: true
  # Only fetch HTTPS URLs, including every redirect the website tool follows.  <optional, default: true>
  httpsOnly: true
  # Refuse URLs whose host resolves to a private, loopback or link-local address (e.g. localhost,
  # 192.168.x.x, the cloud metadata endpoint), guarding against requests into the bot's own network.
  # <optional, default: true>
  blockPrivateAddresses: true

agent:
  # How file attachments are passed to the LLM ("inline" or "upload").
  uploadAttachmentMode: "upload"  # <optional>
  # Maximum total size in MB for inline attachments per message and across conversation history.
  maxInlineAttachmentSizeMB: 100  # <optional>
  # Maximum size in MB of a file (PDF, image, audio, video) loaded from a URL in the user's message.
  # Files from URLs are only loaded in "upload" attachment mode.
  maxExternalUrlFileSizeMB: 500  # <optional>
  # Largest input in tokens a single model call may send, including the conversation history,
  # attachments, system prompt and tools. Counted with the Gemini countTokens API right before each
  # call, which adds a round trip to every call; larger inputs are rejected with a message to the
  # user. Positive integer.  <optional, default: unset = no limit, inputs are not counted>
  # maxInputTokens: 200000
  # How fallback models run alongside main models ("sequential" or "parallel").  <optional, default: "sequential">
  #   sequential: the fallback model is invoked only after the main model fails with a 503 or timeout.
  #   parallel:   both models are invoked at once. The main model's answer is preferred; a successful
  #               fallback answer is used once the node's mainGracePeriodMs runs out. Uses each
  #               model's request quota on every call. Requires mainGracePeriodMs on every node
  #               with a fallbackModel.
  fallbackExecutionMode: "sequential"
  # Search backend to use. Options: "google" | "tavily"   <optional, default: "google">
  #   google: Google Search grounding via Gemini API, answered by the googleSearch node.
  #           Requires GOOGLE_PAID_API_KEYS. Free only for gemini-2.5 models — gemini-3+ requires
  #           a paid plan.
  #   tavily: Tavily Search API. Requires TAVILY_API_KEYS env var. Searches run as a tool and their
  #           results are evaluated by the general node, so the googleSearch node is not used.
  searchMode: "tavily"

  nodes:
    triage:
      model: "gemini-3.5-flash-lite"          # <required>
      apiKeyType: "free"                      # <required>
      fallbackModel: "gemini-3.1-flash-lite"  # <optional>
      # Maximum milliseconds to wait for a triage model response before aborting.
      timeoutMs: 30000                        # <required>
      # Parallel fallback mode only (no-op in sequential mode): milliseconds the main model is given to
      # finish after the fallback model answered cleanly. A clean main answer within this window is
      # preferred, otherwise the fallback answer is used. Required in parallel mode with a fallbackModel.
      # mainGracePeriodMs: 5000
      thinkingLevel: "high"                   # <optional>

    general:
      model: "gemini-3.8-flash"         # <required>
      apiKeyType: "free"                # <required>
      fallbackModel: "gemini-3.6-flash" # <optional>
      # Whether fallback model responses get a Retry button. Set to false when the fallback is an
      # alternative rather than a downgrade. Interrupted responses are always retryable.
      isFallbackRetryable: true         # <optional>
      # Maximum milliseconds to wait for a general model response before aborting.
      timeoutMs: 120000                 # <required>
      # Parallel fallback mode only (no-op in sequential mode): milliseconds the main model is given to
      # finish after the fallback model answered cleanly. A clean main answer within this window is
      # preferred, otherwise the fallback answer is used. Required in parallel mode with a fallbackModel.
      # mainGracePeriodMs: 30000

    computation:
      model: "gemini-3.8-flash"         # <required>
      apiKeyType: "free"                # <required>
      fallbackModel: "gemini-3.6-flash" # <optional>
      # Whether fallback model responses get a Retry button. Set to false when the fallback is an
      # alternative rather than a downgrade. Interrupted responses are always retryable.
      isFallbackRetryable: true         # answerNode<optional>
      # Maximum milliseconds to wait for a general model response before aborting.
      timeoutMs: 120000
      # Parallel fallback mode only (no-op in sequential mode): milliseconds the main model is given to
      # finish after the fallback model answered cleanly. A clean main answer within this window is
      # preferred, otherwise the fallback answer is used. Required in parallel mode with a fallbackModel.
      # mainGracePeriodMs: 30000

    # Only used when searchMode is "google": the model with Google Search grounding that answers
    # search requests.
    googleSearch:
      model: "gemini-3.8-flash"         # <required>
      apiKeyType: "free"                # <required>
      fallbackModel: "gemini-3.6-flash" # <optional>
      # Whether fallback model responses get a Retry button. Set to false when the fallback is an
      # alternative rather than a downgrade. Interrupted responses are always retryable.
      isFallbackRetryable: true         # <optional>
      # Maximum milliseconds to wait for a Google Search model response before aborting.
      timeoutMs: 120000                 # <required>
      # Parallel fallback mode only (no-op in sequential mode): milliseconds the main model is given to
      # finish after the fallback model answered cleanly. A clean main answer within this window is
      # preferred, otherwise the fallback answer is used. Required in parallel mode with a fallbackModel.
      # mainGracePeriodMs: 30000

